[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeverify-x"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11.9,<0.12", "spacy>=3.8,<4", "pydantic>=2.7,<3", "typing-extensions>=4.9", "httpx>=0.27,<1", "aiosqlite>=0.20,<1", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]
verification = ["torch>=2.6,<3", "transformers>=4.45,<5", "sentence-transformers>=3.3,<6", "sentencepiece>=0.2,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.20,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
